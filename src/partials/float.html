  <div id="contact-modal" class="fixed inset-0 z-50 hidden bg-navy-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative animate-[fadeSlideIn_0.25s_ease-out]">
      <button onclick="closeContactModal()" class="absolute top-5 right-5 p-2 rounded-lg text-slate-400 hover:text-navy-900 hover:bg-slate-100">

        <h3 id="modal-title" class="text-2xl font-extrabold text-navy-900">Solicitar Diagnóstico ou Cotação</h3>

        </p>
      </div>

      <form onsubmit="submitLeadForm(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-navy-900 mb-1">Solução de Interesse</label>
          <select id="lead-solucao" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-medium text-navy-900 focus:outline-none focus:border-gold-500">
            <option value="Seguro Garantia (Público, Privado ou Judicial)">Seguro Garantia (Público, Privado ou Judicial)</option>
            <option value="Seguro de Crédito (Mercado Interno e Exportação)">Seguro de Crédito (Mercado Interno e Exportação)</option>
            <option value="Seguro Habitacional e Prestamista (Resolução CNSP 447)">Seguro Habitacional e Prestamista (Resolução CNSP 447)</option>
            <option value="Seguros de Responsabilidade (RC Geral, D&O e E&O)">Seguros de Responsabilidade (RC Geral, D&amp;O e E&amp;O)</option>
            <option value="Diagnóstico Global de Seguros Financeiros">Diagnóstico Global de Seguros Financeiros</option>
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-navy-900 mb-1">Seu Nome / Cargo</label>
            <input id="lead-nome" type="text" required placeholder="Ex: João Silva - CFO" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-gold-500" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-navy-900 mb-1">Empresa / CNPJ</label>

        </div>
        <div>

          <textarea id="lead-contexto" rows="2" placeholder="Ex: Limite para licitações, carteira de loteamento sob CNSP 447, proteção D&O..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-gold-500"></textarea>
        </div>
        <button type="submit" class="w-full gold-gradient-btn text-navy-950 font-bold text-sm py-4 rounded-xl flex items-center justify-center gap-2 shadow-gold">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Iniciar Atendimento com Especialista no WhatsApp</span>
        </button>
