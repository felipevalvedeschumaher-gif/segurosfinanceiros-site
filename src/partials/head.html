<script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#050C17',
              900: '#071120',
              800: '#0F1E36',
              700: '#172C4D',
              600: '#233F6B'
            },
            gold: {
              600: '#AA8218',
              500: '#C59B27',
              400: '#D4AF37',
              300: '#E5C865',
              100: '#FAF3DC'
            },
            slate: {
              50: '#F8FAFC',
              600: '#475569'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          },
          boxShadow: {
            'gold': '0 10px 30px -5px rgba(197, 155, 39, 0.25)',
            'executive': '0 20px 50px -12px rgba(7, 17, 32, 0.14)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #0F1E36;
      overflow-x: hidden;
    }

    h1, h2, h3, .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Sutil textura executiva nos fundos escuros */
    .bg-executive-grid {
      background-color: #071120;
      background-image: 
        radial-gradient(at 85% 15%, rgba(197, 155, 39, 0.14) 0px, transparent 50%),
        radial-gradient(at 10% 85%, rgba(23, 44, 77, 0.55) 0px, transparent 50%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #F3DE9A 0%, #D4AF37 50%, #B68B1E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-gradient-btn {
      background: linear-gradient(135deg, #D4AF37 0%, #B88E1E 100%);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gold-gradient-btn:hover {
      background: linear-gradient(135deg, #E2C04B 0%, #C59B27 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -6px rgba(197, 155, 39, 0.45);
    }

    /* Transição suave entre páginas (Astro View Transitions simulation) */
    .page-view {
      display: none;
      animation: fadeSlideIn 0.35s ease-out forwards;
    }

    .page-view.active {
      display: block;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scrollbar refinada */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #071120;
    }
    ::-webkit-scrollbar-thumb {
      background: #233F6B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C59B27;
    }
  </style>
